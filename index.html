<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<meta
name="description"
content="Modern Weather App built with JavaScript using the Open-Meteo API. Search any city worldwide and view forecasts.">
<meta name="theme-color" content="#4facfe">
    <title>Real-Time Weather Forecast</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4facfe">

</head>

<body>

    <div class="container">

        <h1>🌤️ Real-Time Weather Forecast</h1>

        <!-- Top Buttons -->
        <div class="top-buttons">

            <button id="themeBtn" aria-label="Toggle Dark Mode">
                🌙 Dark Mode
            </button>

            <button id="unitBtn" aria-label="Change Temperature Unit">
                🌡️ °C
            </button>

        </div>

        <!-- Search -->
        <div class="search-box">

            <div class="search-input">

                <input
                    type="text"
                    id="city"
                    placeholder="Enter city..."
                    autocomplete="off">

                <ul id="suggestions"></ul>

            </div>

            <button id="searchBtn">
                🔍 Search
            </button>

            <button id="locationBtn">
                📍 My Location
            </button>

        </div>

        <main class="content">

            <!-- Weather Section -->
            <section class="weather-section">

                <div id="spinner" class="spinner hidden"></div>

                <div id="result"></div>

                <!-- Weather Chart -->
                <canvas id="weatherChart"></canvas>

                <button id="favoriteBtn">
                    ❤️ Add to Favorites
                </button>

            </section>

            <!-- Sidebar -->
            <aside class="sidebar">

                <h3>🕒 Recent Searches</h3>

                <ul id="history"></ul>

                <h3>❤️ Favorite Cities</h3>

                <ul id="favorites"></ul>

            </aside>

        </main>

    </div>
    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="app.js"></script>

</body>

</html>
